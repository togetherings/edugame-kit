<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="top">
      <h1 data-t="title">Memory Match</h1>
      <div class="stats" aria-live="polite">
        <span><b id="moves">0</b> <span data-t="moves">moves</span></span>
        <span><b id="found">0</b> <span data-t="of">of</span> <b id="total">8</b> <span data-t="pairs">pairs</span></span>
      </div>
    </header>
    <p class="note" id="rule"></p>
    <div class="grid" id="grid" role="grid" data-t-attr="aria-label:cards"></div>
    <p class="note warn" id="error" role="alert" hidden></p>

    <section class="done" id="done" hidden>
      <h2 id="done-title"></h2>
      <p id="done-summary"></p>
      <p class="note" id="done-standing"></p>
      <div class="actions">
        <button type="button" class="go" id="btn-again" data-t="again">Play again</button>
        <button type="button" id="btn-exit" data-t="exit">Back to games</button>
      </div>
    </section>
  </main>
  <script src="edugame-config.js"></script>
  <script src="edugame.js"></script>
  <script src="game.js"></script>
</body>
</html>
