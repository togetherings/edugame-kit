name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kolibri Games is installed for the tests that check the zips with its own rules
  # and play the games on its games page (needs 0.2.0+, with Saved and Scored Games).
  KOLIBRI_GAMES: "kolibri-games @ git+https://github.com/togetherings/kolibri-games@main"

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest libzim -e . "$KOLIBRI_GAMES"
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q -rs
      - name: Build the examples
        run: for g in examples/*/; do tools/ci_run.sh "Build $g" edugame build "$g" --all -o dist; done; ls -l dist

  without-kolibri-games:
    name: Unit tests (the kit alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - run: pip install pytest -e .
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q -rs
      - name: The installed kit makes and builds a game
        run: |
          pip install build && python -m build --wheel --outdir wheel
          python -m venv /tmp/kit && /tmp/kit/bin/pip install wheel/*.whl
          cd /tmp && /tmp/kit/bin/edugame new star-steps --type scored && /tmp/kit/bin/edugame build star-steps --sugarizer
          ls -l /tmp/dist

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright -e . "$KOLIBRI_GAMES"
      - run: python -m playwright install --with-deps chromium
      - run: tools/ci_run.sh "Browser test" python -m tests.e2e_browser --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
