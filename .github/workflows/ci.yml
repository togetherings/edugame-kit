name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kolibri Games is installed for the tests that check the zips with its own rules
  # and play the games on its games page (needs 0.2.0+, with Saved and Scored Games).
  KOLIBRI_GAMES: "kolibri-games @ git+https://github.com/togetherings/kolibri-games@main"

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Python's own images, so old versions keep working after GitHub's runners drop them
    # (ubuntu-latest, Ubuntu 26.04, has no Python 3.8 or 3.9).
    container: python:${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest libzim -e . "$KOLIBRI_GAMES"
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q -rs
      - name: Build the examples
        run: for g in examples/*/; do tools/ci_run.sh "Build $g" edugame build "$g" --all -o dist; done; ls -l dist

  without-kolibri-games:
    name: Unit tests (the kit alone)
    runs-on: ubuntu-latest
    container: python:3.8          # the oldest Python the kit supports
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest -e .
      - run: tools/ci_run.sh "Unit tests" python -m pytest -q -rs
      - name: The installed kit makes and builds a game
        run: |
          pip install build && python -m build --wheel --outdir wheel
          python -m venv /tmp/kit && /tmp/kit/bin/pip install wheel/*.whl
          cd /tmp && /tmp/kit/bin/edugame new star-steps --type scored && /tmp/kit/bin/edugame build star-steps --sugarizer
          ls -l /tmp/dist

  browser:
    name: Browser test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright -e . "$KOLIBRI_GAMES"
      - run: python -m playwright install --with-deps chromium
      - run: tools/ci_run.sh "Browser test" python -m tests.e2e_browser --screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  # Plays the starter games and an example in a real Kolibri (edugame kolibri-test), as a
  # game made with the kit does in its own Build workflow.
  kolibri:
    name: Real Kolibri (${{ matrix.game }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [templates/saved, templates/scored, examples/number-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kolibri, the kit and a browser
        run: |
          pip install kolibri playwright -e .
          python -m playwright install --with-deps chromium
          echo "::notice title=Kolibri version::$(python -c 'import kolibri; print(kolibri.__version__)')"
      - name: Play the game in Kolibri
        run: |
          case "${{ matrix.game }}" in
            templates/*) edugame new game --type "$(basename ${{ matrix.game }})" --github; GAME=game ;;
            *) GAME="${{ matrix.game }}" ;;
          esac
          edugame kolibri-test "$GAME" --screenshots kolibri-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolibri-screenshots-${{ strategy.job-index }}
          path: kolibri-screenshots
          if-no-files-found: ignore

  # The one check the "Protect main" ruleset requires in every togetherings repository: it passes only when
  # every job above passed, so tests can be added or renamed without changing the ruleset.
  checks-passed:
    name: Checks passed
    if: always()
    needs: [unit, without-kolibri-games, browser, kolibri]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
