# Publishes Number Hunt, one of the examples, to GitHub Pages with game-pages.yml, the workflow
# every game's pages.yml calls (here with the kit from this commit).
#
# One-time setup:
#   1. Settings > Pages > Source: GitHub Actions.
#   2. To count visits with GoatCounter: Settings > Secrets and variables > Actions >
#      Variables > New repository variable: GOATCOUNTER_CODE (for example togetherings).
# See docs/platforms/GITHUB_PAGES.md.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    name: Pages
    uses: ./.github/workflows/game-pages.yml
    with:
      folder: examples/number-hunt
      kit: "."
